<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 574" width="920" height="574" role="img" aria-labelledby="conv-title conv-desc" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title id="conv-title">A conversation with EMMA</title>
  <desc id="conv-desc">You ask what time it is and she answers. You tell her your daughter is called Sara and she records it as fact number one. After a restart and several days, you ask what your daughter is called and she still knows.</desc>

  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151E"/>
      <stop offset="100%" stop-color="#171B27"/>
    </linearGradient>
  </defs>

  <rect width="920" height="574" rx="18" fill="url(#card)"/>
  <rect x="0.5" y="0.5" width="919" height="573" rx="18" fill="none" stroke="#272D3D"/>

  <!-- header -->
  <path d="M0 57 H920" stroke="#242A38"/>
  <circle cx="34" cy="29" r="14" fill="#8A63D2"/>
  <text x="34" y="34" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text>
  <text x="58" y="26" font-size="14.5" font-weight="600" fill="#E9EEF6">EMMA</text>
  <circle cx="63" cy="40" r="3.5" fill="#2DD4BF"/>
  <text x="73" y="44" font-size="11.5" fill="#5B6577">on your server</text>
  <text x="888" y="34" font-size="11.5" fill="#5B6577" text-anchor="end">Telegram</text>

  <!-- 1. you -->
  <rect x="740" y="78" width="148" height="38" rx="13" fill="#4C6EF5"/>
  <text x="762" y="103" font-size="14.5" fill="#FFFFFF">che ore sono?</text>
  <text x="888" y="131" font-size="11.5" font-style="italic" fill="#6B7688" text-anchor="end">what time is it?</text>

  <!-- 2. her -->
  <rect x="32" y="145" width="378" height="38" rx="13" fill="#1E2432"/>
  <text x="54" y="170" font-size="14.5" fill="#DCE3EE">Sono le 20:11 di mercoled&#236; 2 settembre 2026.</text>
  <text x="34" y="198" font-size="11.5" font-style="italic" fill="#6B7688">it is 20:11 on Wednesday 2 September 2026</text>

  <!-- 3. you -->
  <rect x="558" y="212" width="330" height="38" rx="13" fill="#4C6EF5"/>
  <text x="580" y="237" font-size="14.5" fill="#FFFFFF">ricorda che mia figlia si chiama Sara</text>
  <text x="888" y="265" font-size="11.5" font-style="italic" fill="#6B7688" text-anchor="end">remember my daughter is called Sara</text>

  <!-- 4. her -->
  <rect x="32" y="279" width="316" height="60" rx="13" fill="#1E2432"/>
  <text x="54" y="304" font-size="14.5" fill="#DCE3EE">Registrato come fatto #1.</text>
  <text x="54" y="326" font-size="14.5" fill="#DCE3EE">Lo ricordero&#39; anche fra molti giorni.</text>
  <text x="34" y="354" font-size="11.5" font-style="italic" fill="#6B7688">noted as fact #1 &#8212; I will still know it in months</text>

  <!-- divider -->
  <path d="M32 385 H330" stroke="#272D3D"/>
  <path d="M590 385 H888" stroke="#272D3D"/>
  <text x="460" y="389" font-size="11.5" fill="#5B6577" text-anchor="middle">a restart, and several days later</text>

  <!-- 5. you -->
  <rect x="640" y="415" width="248" height="38" rx="13" fill="#4C6EF5"/>
  <text x="662" y="440" font-size="14.5" fill="#FFFFFF">come si chiama mia figlia?</text>
  <text x="888" y="468" font-size="11.5" font-style="italic" fill="#6B7688" text-anchor="end">what is my daughter called?</text>

  <!-- 6. her -->
  <rect x="32" y="482" width="156" height="38" rx="13" fill="#1E2432"/>
  <text x="54" y="507" font-size="14.5" fill="#DCE3EE">Si chiama Sara.</text>
  <text x="34" y="535" font-size="11.5" font-style="italic" fill="#6B7688">she is called Sara</text>

  <text x="460" y="558" font-size="11.5" fill="#5B6577" text-anchor="middle">the conversation window had long since rolled past that message &#8212; the fact had not</text>
</svg>
